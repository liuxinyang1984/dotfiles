<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<!-- managed-by: dotfiles fonts/maple -->
<!--
  Maple / Noto 不进 monospace。
  monospace 由 SunSong/Sol7 点阵接管；缺字（含 Nerd）显示 .notdef/方块，不回退 TTF。
  需要 Maple 时请在应用里显式写 family（如 Alacritty font.normal.family）。
-->
<fontconfig>
	<match target="pattern">
		<test qual="any" name="family"><string>sans-serif</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>Noto Sans CJK SC</string>
		</edit>
	</match>

	<match target="pattern">
		<test qual="any" name="family"><string>serif</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>Noto Serif CJK SC</string>
		</edit>
	</match>

	<!-- 旧配置兼容：显式请求 Terminus 时改走 Maple -->
	<match target="pattern">
		<test qual="any" name="family"><string>Terminus</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>Maple Mono NL NF</string>
		</edit>
	</match>
</fontconfig>
