<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<!-- managed-by: dotfiles fonts/sunsong -->
<!--
  monospace 钉 scalable=false，避免 TTF（Maple/Nerd/DejaVu）回退。
  外来点阵（Terminus 等）由 /etc/fonts/conf.d/99-sol7-bitmap-whitelist.conf 剔除
  （须晚于系统 75-yes-terminus；见 install.sh 的 default 目标）。
-->
<fontconfig>
	<match target="pattern">
		<test qual="any" name="family"><string>monospace</string></test>
		<test qual="first" name="family" compare="not_eq"><string>Maple Mono NL NF</string></test>
		<test qual="first" name="family" compare="not_eq"><string>Ttyp0 OTB</string></test>
		<edit name="scalable" mode="assign" binding="strong">
			<bool>false</bool>
		</edit>
	</match>
</fontconfig>
