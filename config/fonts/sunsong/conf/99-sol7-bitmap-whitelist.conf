<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<!-- managed-by: dotfiles fonts/sunsong -->
<!--
  装到 /etc/fonts/conf.d/99-sol7-bitmap-whitelist.conf（须晚于 75-yes-terminus）。
  本机 pattern 版 reject(outline/scalable) 无效，改用 glob。

  拒掉会抢 Lucida「英文味」符号的外来点阵；只留 Sol7（**/fonts/SunSong/**）。
  缺字 → 方块。显式 Maple 等 TTF 不拒。
-->
<fontconfig>
	<selectfont>
		<!-- Terminus（含 75-yes-terminus 再次放行的） -->
		<rejectfont><glob>**/ter-*</glob></rejectfont>
		<rejectfont><glob>**/terminus/**</glob></rejectfont>
		<!-- 文泉驿等大字符集点阵 -->
		<rejectfont><glob>**/wqy-unibit/**</glob></rejectfont>
		<rejectfont><glob>**/wqy-unibit*</glob></rejectfont>
		<rejectfont><glob>**/wqy-bitmapsong/**</glob></rejectfont>
		<rejectfont><glob>**/WenQuanYi*/**</glob></rejectfont>
		<!-- X11 经典目录里的 Misc Fixed / Adobe / 100dpi 等 -->
		<rejectfont><glob>/usr/share/fonts/misc/*</glob></rejectfont>
		<rejectfont><glob>/usr/share/fonts/100dpi/*</glob></rejectfont>
		<rejectfont><glob>/usr/share/fonts/75dpi/*</glob></rejectfont>
		<!-- 其它常见用户点阵（保留 **/fonts/SunSong/**） -->
		<rejectfont><glob>**/fonts/gohufont*/**</glob></rejectfont>
		<rejectfont><glob>**/fonts/Gohu*/**</glob></rejectfont>
		<rejectfont><glob>**/fonts/waffle/**</glob></rejectfont>
		<rejectfont><glob>**/waffle*</glob></rejectfont>
		<rejectfont><glob>**/fonts/spleen*/**</glob></rejectfont>
		<rejectfont><glob>**/fonts/cozette*/**</glob></rejectfont>
		<rejectfont><glob>**/fonts/tamzen*/**</glob></rejectfont>
	</selectfont>
</fontconfig>
