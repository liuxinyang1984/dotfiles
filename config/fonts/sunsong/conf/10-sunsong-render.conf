		<test qual="first" name="family" compare="not_eq"><string>Maple Mono NL NF</string></test>
		<test qual="first" name="family" compare="not_eq"><string>Ttyp0 OTB</string></test>
		<test name="size" compare="eq"><double>13</double></test>
		<edit name="pixelsize" mode="assign" binding="strong"><double>14</double></edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family"><string>monospace</string></test>
		<!-- 点名 Maple 时勿劫持（弱绑 monospace） -->
		<test qual="first" name="family" compare="not_eq"><string>Maple Mono NL NF</string></test>
		<test qual="first" name="family" compare="not_eq"><string>Ttyp0 OTB</string></test>
		<test name="size" compare="eq"><double>14</double></test>
		<edit name="pixelsize" mode="assign" binding="strong"><double>14</double></edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family"><string>monospace</string></test>
		<!-- 点名 Maple 时勿劫持（弱绑 monospace） -->
		<test qual="first" name="family" compare="not_eq"><string>Maple Mono NL NF</string></test>
		<test qual="first" name="family" compare="not_eq"><string>Ttyp0 OTB</string></test>
		<test name="size" compare="eq"><double>15</double></test>
		<edit name="pixelsize" mode="assign" binding="strong"><double>14</double></edit>
	</match>
	<match target="pattern">
		<test qual="first" name="family"><string>sans-serif</string></test>
		<test name="size" compare="eq"><double>13</double></test>
		<edit name="pixelsize" mode="assign" binding="strong"><double>14</double></edit>
	</match>
	<match target="pattern">
		<test qual="first" name="family"><string>sans-serif</string></test>
		<test name="size" compare="eq"><double>14</double></test>
		<edit name="pixelsize" mode="assign" binding="strong"><double>14</double></edit>
	</match>
	<match target="pattern">
		<test qual="first" name="family"><string>sans-serif</string></test>
		<test name="size" compare="eq"><double>15</double></test>
		<edit name="pixelsize" mode="assign" binding="strong"><double>14</double></edit>
	</match>
	<match target="pattern">
		<test qual="first" name="family"><string>serif</string></test>
		<test name="size" compare="eq"><double>13</double></test>
		<edit name="pixelsize" mode="assign" binding="strong"><double>14</double></edit>
	</match>
	<match target="pattern">
		<test qual="first" name="family"><string>serif</string></test>
		<test name="size" compare="eq"><double>14</double></test>
		<edit name="pixelsize" mode="assign" binding="strong"><double>14</double></edit>
	</match>
	<match target="pattern">
		<test qual="first" name="family"><string>serif</string></test>
		<test name="size" compare="eq"><double>15</double></test>
		<edit name="pixelsize" mode="assign" binding="strong"><double>14</double></edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family"><string>monospace</string></test>
		<!-- 点名 Maple 时勿劫持（弱绑 monospace） -->
		<test qual="first" name="family" compare="not_eq"><string>Maple Mono NL NF</string></test>
		<test qual="first" name="family" compare="not_eq"><string>Ttyp0 OTB</string></test>
		<test name="size" compare="eq"><double>12</double></test>
		<edit name="pixelsize" mode="assign" binding="strong"><double>12</double></edit>
	</match>
	<match target="pattern">
		<test qual="first" name="family"><string>sans-serif</string></test>
		<test name="size" compare="eq"><double>12</double></test>
		<edit name="pixelsize" mode="assign" binding="strong"><double>12</double></edit>
	</match>
	<match target="pattern">
		<test qual="first" name="family"><string>serif</string></test>
		<test name="size" compare="eq"><double>12</double></test>
		<edit name="pixelsize" mode="assign" binding="strong"><double>12</double></edit>
	</match>

	<!-- 无字号回退见 99-default-sunsong（prefer）；勿 weak 挂 pixelsize -->

	<!--
	  离散 Font Set（只在配套点阵之间切换；档内英/中字号固定，不连续缩放）:
	    请求 ≤12           → 物理标记 14  = XView 12
	    请求 13 / 14 / 15  → 物理标记 16  = XView 14（medium；13≡14 同套）
	    请求 16–19         → 物理标记 18  = XView 16
	    请求 20–23         → 物理标记 22  = XView 20
	    请求 ≥24           → 物理标记 26  = XView 24

	  仅按 pixelsize 吸档（size 精确逻辑档已在上方写成入口）。
	  从大到小；qual=any（系统会在首位插 weak 族，qual=first 会失效）。
	-->
	<!-- pixelsize → Font Set 标记 -->
	<match target="pattern">
		<test qual="any" name="family"><string>monospace</string></test>
		<!-- 点名 Maple 时勿劫持（弱绑 monospace） -->
		<test qual="first" name="family" compare="not_eq"><string>Maple Mono NL NF</string></test>
		<test qual="first" name="family" compare="not_eq"><string>Ttyp0 OTB</string></test>
		<test name="pixelsize" compare="more_eq"><double>24</double></test>
		<edit name="pixelsize" mode="assign" binding="strong"><double>26</double></edit>
	</match>
	<match target="pattern">
		<test qual="first" name="family"><string>sans-serif</string></test>
		<test name="pixelsize" compare="more_eq"><double>24</double></test>
		<edit name="pixelsize" mode="assign" binding="strong"><double>26</double></edit>
	</match>
	<match target="pattern">
		<test qual="first" name="family"><string>serif</string></test>
		<test name="pixelsize" compare="more_eq"><double>24</double></test>
		<edit name="pixelsize" mode="assign" binding="strong"><double>26</double></edit>
	</match>

	<match target="pattern">
		<test qual="any" name="family"><string>monospace</string></test>
		<!-- 点名 Maple 时勿劫持（弱绑 monospace） -->
		<test qual="first" name="family" compare="not_eq"><string>Maple Mono NL NF</string></test>
		<test qual="first" name="family" compare="not_eq"><string>Ttyp0 OTB</string></test>
		<test name="pixelsize" compare="more_eq"><double>20</double></test>
		<test name="pixelsize" compare="less_eq"><double>23</double></test>
		<edit name="pixelsize" mode="assign" binding="strong"><double>22</double></edit>
	</match>
	<match target="pattern">
		<test qual="first" name="family"><string>sans-serif</string></test>
		<test name="pixelsize" compare="more_eq"><double>20</double></test>
		<test name="pixelsize" compare="less_eq"><double>23</double></test>
		<edit name="pixelsize" mode="assign" binding="strong"><double>22</double></edit>
	</match>
	<match target="pattern">
		<test qual="first" name="family"><string>serif</string></test>
		<test name="pixelsize" compare="more_eq"><double>20</double></test>
		<test name="pixelsize" compare="less_eq"><double>23</double></test>
		<edit name="pixelsize" mode="assign" binding="strong"><double>22</double></edit>
	</match>

	<match target="pattern">
		<test qual="any" name="family"><string>monospace</string></test>
		<!-- 点名 Maple 时勿劫持（弱绑 monospace） -->
		<test qual="first" name="family" compare="not_eq"><string>Maple Mono NL NF</string></test>
		<test qual="first" name="family" compare="not_eq"><string>Ttyp0 OTB</string></test>
		<test name="pixelsize" compare="more_eq"><double>16</double></test>
		<test name="pixelsize" compare="less_eq"><double>19</double></test>
		<edit name="pixelsize" mode="assign" binding="strong"><double>18</double></edit>
	</match>
	<match target="pattern">
		<test qual="first" name="family"><string>sans-serif</string></test>
		<test name="pixelsize" compare="more_eq"><double>16</double></test>
		<test name="pixelsize" compare="less_eq"><double>19</double></test>
		<edit name="pixelsize" mode="assign" binding="strong"><double>18</double></edit>
	</match>
	<match target="pattern">
		<test qual="first" name="family"><string>serif</string></test>
		<test name="pixelsize" compare="more_eq"><double>16</double></test>
		<test name="pixelsize" compare="less_eq"><double>19</double></test>
		<edit name="pixelsize" mode="assign" binding="strong"><double>18</double></edit>
	</match>

	<!-- 13≡14≡15 → 同一套 medium（标记 16） -->
	<match target="pattern">
		<test qual="any" name="family"><string>monospace</string></test>
		<!-- 点名 Maple 时勿劫持（弱绑 monospace） -->
		<test qual="first" name="family" compare="not_eq"><string>Maple Mono NL NF</string></test>
		<test qual="first" name="family" compare="not_eq"><string>Ttyp0 OTB</string></test>
		<test name="pixelsize" compare="more_eq"><double>13</double></test>
		<test name="pixelsize" compare="less_eq"><double>15</double></test>
		<edit name="pixelsize" mode="assign" binding="strong"><double>16</double></edit>
	</match>
	<match target="pattern">
		<test qual="first" name="family"><string>sans-serif</string></test>
		<test name="pixelsize" compare="more_eq"><double>13</double></test>
		<test name="pixelsize" compare="less_eq"><double>15</double></test>
		<edit name="pixelsize" mode="assign" binding="strong"><double>16</double></edit>
	</match>
	<match target="pattern">
		<test qual="first" name="family"><string>serif</string></test>
		<test name="pixelsize" compare="more_eq"><double>13</double></test>
		<test name="pixelsize" compare="less_eq"><double>15</double></test>
		<edit name="pixelsize" mode="assign" binding="strong"><double>16</double></edit>
	</match>

	<match target="pattern">
		<test qual="any" name="family"><string>monospace</string></test>
