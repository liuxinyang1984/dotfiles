		<edit name="weight" mode="assign" binding="strong"><const>medium</const></edit>
	</match>
	<match target="pattern">
		<test qual="first" name="family"><string>serif</string></test>
		<test name="pixelsize" compare="eq"><double>14</double></test>
		<edit name="weight" mode="assign" binding="strong"><const>medium</const></edit>
	</match>
	<match target="pattern">
