		<edit name="weight" mode="assign" binding="strong"><const>medium</const></edit>
	</match>

	<!-- ========== monospace / FIXEDWIDTH ========== -->
	<!-- 14/16/18/22：UW ttyp0 + Song；26：无 13×26，纯宋 -->
	<match target="pattern">
		<test qual="any" name="family"><string>monospace</string></test>
		<!-- 点名 Maple 时勿劫持（弱绑 monospace） -->
		<test qual="first" name="family" compare="not_eq"><string>Maple Mono NL NF</string></test>
		<test qual="first" name="family" compare="not_eq"><string>Ttyp0 OTB</string></test>
		<test name="pixelsize" compare="eq"><double>14</double></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>Ttyp0 OTB</string>
			<string>SunSong</string>
		</edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family"><string>monospace</string></test>
		<!-- 点名 Maple 时勿劫持（弱绑 monospace） -->
		<test qual="first" name="family" compare="not_eq"><string>Maple Mono NL NF</string></test>
		<test qual="first" name="family" compare="not_eq"><string>Ttyp0 OTB</string></test>
		<test name="pixelsize" compare="eq"><double>16</double></test>
		<test qual="all" name="weight" compare="less"><const>bold</const></test>
		<edit name="family" mode="prepend" binding="strong">
