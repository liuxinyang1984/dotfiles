<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<!-- managed-by: dotfiles fonts/sunsong -->
<!--
  模拟 Solaris 7 zh OpenWindows.fs / XView Font Set（非「随便能用」的简化版）。

  XView 逻辑字号 → 物理组合（与 OpenWindows.fs 一致）:
    logical 12 → 物理 14
    logical 14 → 物理 16   （默认 medium）
    logical 16 → 物理 18
    logical 20 → 物理 22
    logical 24 → 物理 26

  FIXEDWIDTH (monospace):
    12 → Ttyp0 OTB@14 + SunSong@14
    14 → Ttyp0 OTB@16 + SunSong@16     ★ medium（原 lutRA@14+Song@16）
    16 → Ttyp0 OTB@18 + SunSong@18
    20 → Ttyp0 OTB@22 + SunSong@22
    24 → SunSong Roman@26 + SunSong@26 （无 13×26 ttyp0）

  SANS_SERIF (sans-serif):
    12 → Lucida Sans@14 + SunSong@14          (p-chinese-0)
    14 → Lucida Sans@17 + SunSong@16          (p；Lucida 通配 → fc 就近 17)
    16/20/24 → Roman + Song 同档              (原表改走 c-chinese-0)

  SERIF:
    12 → Roman@14 + Song@14                   (c)
    14 → Lucida Sans@17 + SunSong@16          (p)
    16/20/24 → Roman + Song 同档

  实现要点：见 SOURCE.txt。
  只在配套点阵 Font Set 间切换；13≡14≡15 同一套 medium，档内不再缩放。
-->
<fontconfig>
	<selectfont>
		<acceptfont>
			<pattern><patelt name="family"><string>SunSong</string></patelt></pattern>
		</acceptfont>
		<acceptfont>
			<pattern><patelt name="family"><string>SunSong Roman</string></patelt></pattern>
		</acceptfont>
		<acceptfont>
			<pattern><patelt name="family"><string>Lucida Sans</string></patelt></pattern>
		</acceptfont>
		<acceptfont>
			<pattern><patelt name="family"><string>Lucida Sans Typewriter</string></patelt></pattern>
		</acceptfont>
		<acceptfont>
			<pattern><patelt name="family"><string>LucidaTypewriter</string></patelt></pattern>
		</acceptfont>
		<acceptfont>
			<pattern><patelt name="family"><string>Ttyp0 OTB</string></patelt></pattern>
		</acceptfont>
	</selectfont>

	<alias binding="same">
		<family>Song</family>
		<accept><family>SunSong</family></accept>
	</alias>
	<alias binding="same">
		<family>Song Roman</family>
		<accept><family>SunSong Roman</family></accept>
	</alias>
	<!-- Sol7 短名 → 当作 monospace 逻辑档（应用写 family=song14 时） -->
	<alias binding="same">
		<family>song12</family>
		<accept><family>monospace</family></accept>
	</alias>
	<alias binding="same">
		<family>song14</family>
		<accept><family>monospace</family></accept>
	</alias>
	<alias binding="same">
		<family>song16</family>
		<accept><family>monospace</family></accept>
	</alias>
	<alias binding="same">
		<family>song20</family>
		<accept><family>monospace</family></accept>
	</alias>
	<alias binding="same">
		<family>song24</family>
		<accept><family>monospace</family></accept>
	</alias>
	<!-- songb14 → FIXEDWIDTH BOLD medium（应用需带 weight=bold，或依赖此名时另设） -->
	<alias binding="same">
		<family>songb14</family>
		<accept><family>monospace</family></accept>
	</alias>

	<!-- 仅 generic 族 append regular（勿全局，以免改到 DejaVu/Noto 等点名请求） -->
	<match target="pattern">
		<test qual="any" name="family"><string>monospace</string></test>
		<!-- 点名 Maple 时勿劫持（弱绑 monospace） -->
		<test qual="first" name="family" compare="not_eq"><string>Maple Mono NL NF</string></test>
		<test qual="first" name="family" compare="not_eq"><string>Ttyp0 OTB</string></test>
		<edit name="weight" mode="append" binding="strong"><const>regular</const></edit>
	</match>
	<match target="pattern">
		<test qual="first" name="family"><string>sans-serif</string></test>
		<edit name="weight" mode="append" binding="strong"><const>regular</const></edit>
	</match>
	<match target="pattern">
		<test qual="first" name="family"><string>serif</string></test>
		<edit name="weight" mode="append" binding="strong"><const>regular</const></edit>
	</match>

	<!--
	  size 恰好为 XView 逻辑档（12/14/16/20/24）时，当作逻辑字号写入
	  pixelsize 入口（供随后吸附）。dpi 旁路算出的 size（如 15.36）不碰，
	  以免 pixelsize=16 被误判成 medium。
	-->
	<match target="pattern">
		<test qual="any" name="family"><string>monospace</string></test>
		<!-- 点名 Maple 时勿劫持（弱绑 monospace） -->
		<test qual="first" name="family" compare="not_eq"><string>Maple Mono NL NF</string></test>
		<test qual="first" name="family" compare="not_eq"><string>Ttyp0 OTB</string></test>
		<test name="size" compare="eq"><double>24</double></test>
		<edit name="pixelsize" mode="assign" binding="strong"><double>24</double></edit>
	</match>
	<match target="pattern">
		<test qual="first" name="family"><string>sans-serif</string></test>
		<test name="size" compare="eq"><double>24</double></test>
		<edit name="pixelsize" mode="assign" binding="strong"><double>24</double></edit>
	</match>
	<match target="pattern">
		<test qual="first" name="family"><string>serif</string></test>
		<test name="size" compare="eq"><double>24</double></test>
		<edit name="pixelsize" mode="assign" binding="strong"><double>24</double></edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family"><string>monospace</string></test>
		<!-- 点名 Maple 时勿劫持（弱绑 monospace） -->
		<test qual="first" name="family" compare="not_eq"><string>Maple Mono NL NF</string></test>
		<test qual="first" name="family" compare="not_eq"><string>Ttyp0 OTB</string></test>
		<test name="size" compare="eq"><double>20</double></test>
		<edit name="pixelsize" mode="assign" binding="strong"><double>20</double></edit>
	</match>
	<match target="pattern">
		<test qual="first" name="family"><string>sans-serif</string></test>
		<test name="size" compare="eq"><double>20</double></test>
		<edit name="pixelsize" mode="assign" binding="strong"><double>20</double></edit>
	</match>
	<match target="pattern">
		<test qual="first" name="family"><string>serif</string></test>
		<test name="size" compare="eq"><double>20</double></test>
		<edit name="pixelsize" mode="assign" binding="strong"><double>20</double></edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family"><string>monospace</string></test>
		<!-- 点名 Maple 时勿劫持（弱绑 monospace） -->
		<test qual="first" name="family" compare="not_eq"><string>Maple Mono NL NF</string></test>
		<test qual="first" name="family" compare="not_eq"><string>Ttyp0 OTB</string></test>
		<test name="size" compare="eq"><double>16</double></test>
		<edit name="pixelsize" mode="assign" binding="strong"><double>16</double></edit>
	</match>
	<match target="pattern">
		<test qual="first" name="family"><string>sans-serif</string></test>
		<test name="size" compare="eq"><double>16</double></test>
		<edit name="pixelsize" mode="assign" binding="strong"><double>16</double></edit>
	</match>
	<match target="pattern">
		<test qual="first" name="family"><string>serif</string></test>
		<test name="size" compare="eq"><double>16</double></test>
		<edit name="pixelsize" mode="assign" binding="strong"><double>16</double></edit>
	</match>
	<!-- 13/14/15 同 medium 入口 -->
	<match target="pattern">
		<test qual="any" name="family"><string>monospace</string></test>
